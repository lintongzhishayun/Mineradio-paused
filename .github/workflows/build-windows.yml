name: Build Mineradio Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "desktop/**"
      - "build/**"
      - "cuefield/**"
      - "server.js"
      - "*-api.js"
      - "qishui-auth-v6.js"
      - "qishui-qr-login.js"
      - "qishui-auth-v6/**"
      - "qishui-audio-decryptor/**"
      - "dj-analyzer.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Test immersive lyric preference
        run: node --test tests/immersive-lyric-visibility.test.js
      - name: Build Windows installer
        run: npm run build:win -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Mineradio-2.2.0-no-auto-lyrics-Windows
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
